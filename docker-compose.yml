services:
  db:
    image: postgres:17-alpine
    container_name: bikestore_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - bikestore_pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U BikeStore -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bikestore_pgdata:
